name: Android release APK

"on":
  workflow_dispatch:
  push:
    branches:
      - feature/built-in-audio-effects
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release-apk:
    name: Build arm64 release APK
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      CI: "true"
      HELIO_ANDROID_ABIS: arm64-v8a
      HELIO_KEYSTORE_PATH: ${{ runner.temp }}/helio.keystore
      HELIO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'android' }}
      HELIO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'release' }}
      HELIO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'android' }}
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: gradle
          cache-dependency-path: Projects/Android/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-28" "build-tools;28.0.3" "cmake;3.19.0" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install and configure ccache
        run: |
          sudo apt-get install -y ccache
          ccache --set-config=max_size=1500M
          ccache --zero-stats

      - name: Restore native compilation cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: android-arm64-${{ runner.os }}-${{ hashFiles('Source/**/*.cpp', 'Source/**/*.h', 'Projects/Projucer/JuceLibraryCode/UnityBuild.cpp', 'Projects/Android/app/CMakeLists.txt') }}
          restore-keys: |
            android-arm64-${{ runner.os }}-

      - name: Configure APK signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$HELIO_KEYSTORE_PATH"
          else
            keytool -genkeypair -v \
              -keystore "$HELIO_KEYSTORE_PATH" \
              -storetype JKS \
              -storepass "$HELIO_KEYSTORE_PASSWORD" \
              -keypass "$HELIO_KEY_PASSWORD" \
              -alias "$HELIO_KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Helio CI,O=Helio,C=US"
          fi

      - name: Build optimized arm64 APK
        working-directory: Projects/Android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --parallel --build-cache --max-workers=4 assembleRelease_Release
          ccache --show-stats

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: helio-android-arm64-release
          path: Projects/Android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
